project:
  type: book
  output-dir: _book
  resources:
    - data/
    - images/
book:
  title: Understanding and analyzing social and behavioral data
  author: Yashvin Seetahul
  date: today
  search: true
  repo-url: https://github.com/Y45HV1N/intro-data-analysis
  repo-actions:
  - edit
  - issue
  page-navigation: true
  chapters:
  - index.qmd
  - part: 'Section 1: Getting Started Properly'
    chapters:
    - 01-basics-r.qmd
    - 02-r-vs-rstudio.qmd
    - 03-files-and-environment.qmd
    - 04-projects-and-sessions.qmd
    - 05-objects-and-functions.qmd
    - 06-operations-and-packages.qmd
    - 07-recap.qmd
  - part: 'Section 2: Manipulating and Visualizing Data'
    chapters:
    - 08-data-wrangling-basics.qmd
    - 09-tidyverse-and-descriptives.qmd
    - 10-data-visualization-principles.qmd
    - 11-wrangling-for-psychology.qmd
    - 12-advanced-wrangling-optional.qmd
  - part: 'Section 3: Statistical Modeling — Regressions'
    chapters:
    - 13-data-and-models.qmd
    - 14-mean-as-model.qmd
    - 15-simple-linear-model.qmd
    - 16-fitting-regression.qmd
    - 17-multiple-and-categorical.qmd
    - 18-moderation.qmd
    - 19-bias-variance-assumptions.qmd
    - 20-diagnostics-and-limits.qmd
  - part: 'Section 4: Statistical Inference'
    chapters:
    - 21-why-inference.qmd
    - 22-pvalues-fisher-neyman-pearson.qmd
    - 23-test-statistics-and-df.qmd
    - 24-decisions-errors-power-sesoi.qmd
    - 25-two-roles-multiple-testing.qmd
    - 26-philosophy-of-np.qmd
    - 27-fisher-estimation.qmd
    - 28-bayesian-basics.qmd
    - 29-likelihoodism.qmd
  - part: 'Section 5: Data Visualization in Practice and Communicating Findings'
    chapters:
    - 30-intro-ggplot2.qmd
    - 31-visualizing-means.qmd
    - 32-count-variables.qmd
    - 33-distributions.qmd
    - 34-apa-tables.qmd
    - 35-apa-reporting.qmd
    - 36-coefficient-plots.qmd
    - 37-dataviz-use-cases.qmd
    - 38-audience-targeted-reporting.qmd
  - part: 'Section 6: Causal Inference'
    chapters:
    - 39-why-data-doesnt-tell-causes.qmd
    - 40-potential-outcomes.qmd
    - 41-randomization.qmd
    - 42-dags.qmd
    - 43-confounders-mediators-colliders.qmd
    - 44-backdoor-criterion.qmd
format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    css:
      - include/webex.css
      - include/custom.css
    include-after-body: include/webex.js
execute:
  freeze: auto
  echo: true
  warning: false
  message: false
